name: Debug APK Build

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: Build variant
        required: false
        default: online
        type: choice
        options:
          - online
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Online Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source and native dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages on runner only
        run: |
          # ubuntu-latest provides SDK command-line tools. No tools are added to the app runtime.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          # Ignore only yes's expected SIGPIPE; preserve sdkmanager's exit status.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1" "platform-tools"

      - name: Verify Online Debug task
        env:
          BUILD_VARIANT: ${{ inputs.build_variant || 'online' }}
        run: |
          test "$BUILD_VARIANT" = online || { echo 'Only the lightweight online variant is allowed'; exit 1; }
          chmod +x gradlew
          # Configuration defines :app, runtimeDelivery=online, and debug.
          ./gradlew :app:tasks --all --no-daemon --console=plain > "$RUNNER_TEMP/gradle-tasks.txt"
          grep -E '^assembleOnlineDebug([[:space:]]|$)' "$RUNNER_TEMP/gradle-tasks.txt"

      - name: Build Online Debug APK
        run: ./gradlew :app:assembleOnlineDebug --no-daemon --console=plain --stacktrace

      - name: Validate and prepare APK
        id: apk
        run: |
          mapfile -d '' APKS < <(find app/build/outputs/apk -type f -path '*/online/debug/*.apk' ! -name '*unsigned*' ! -name '*unaligned*' -print0)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected one online debug APK; found ${#APKS[@]}"
            exit 1
          fi
          APK="${APKS[0]}"
          test -s "$APK" || { echo 'APK is empty'; exit 1; }
          echo "Generated APK: $APK"
          unzip -t "$APK" > /dev/null
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          PACKAGE=unknown
          VERSION_NAME=unknown
          VERSION_CODE=unknown
          ABI=unknown
          if [ -x "$TOOLS/aapt2" ]; then
            BADGING=$("$TOOLS/aapt2" dump badging "$APK")
            printf '%s\n' "$BADGING"
            PACKAGE=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$BADGING")
            VERSION_NAME=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")
            VERSION_CODE=$(sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")
            ABI=$(sed -n 's/^native-code: //p' <<< "$BADGING")
            test "$PACKAGE" = com.jarves.mh
            test "$ABI" = "'arm64-v8a'"
          else
            echo '::warning::aapt2 unavailable; optional metadata inspection skipped'
          fi
          mkdir -p debug-artifact
          DEST=debug-artifact/Mobile-Harness-Lite-online-debug.apk
          cp "$APK" "$DEST"
          SIZE=$(stat -c%s "$DEST")
          SHA256=$(sha256sum "$DEST" | cut -d' ' -f1)
          echo "APK size: $SIZE bytes"
          echo "SHA-256: $SHA256"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          {
            echo '# Mobile-Harness-Lite Debug APK'
            echo
            echo 'Build: Online Debug'
            echo
            echo 'APK: Mobile-Harness-Lite-online-debug.apk'
            echo
            echo "APK Size: $SIZE bytes"
            echo
            echo "SHA-256: $SHA256"
            echo
            echo "Package: $PACKAGE"
            echo
            echo "Version: $VERSION_NAME (code $VERSION_CODE)"
            echo
            echo "ABI: $ABI"
            echo
            echo 'This is a debug APK intended for testing and is not a production release.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Harness-Lite-online-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
